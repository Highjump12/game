<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>밤토리의 자기소개</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(1.25rem, 5vw, 3rem);
      background-color: #e8edf9;
      color: #20283d;
      font: 1rem/1.65 system-ui, "Malgun Gothic", sans-serif;
      word-break: keep-all;
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(1.5rem, 6vw, 3rem);
      background: #fff;
      border: 1px solid #d7dfed;
      border-radius: 1.75rem;
      box-shadow: 0 1rem 3rem #20283d14;
    }

    .winter-scene {
      position: relative;
      height: 12rem;
      margin: 0 0 1.5rem;
      overflow: hidden;
      border-radius: 1rem;
      background: var(--winter-sky, #456499);
    }

    .winter-scene canvas { display: block; width: 100%; height: 100%; }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
      line-height: 1.2;
      letter-spacing: -.06em;
    }

    header p { margin: .75rem 0 0; color: #47536c; }
    .car-photo {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: center;
      gap: .9rem;
      margin: 1.25rem 0 0;
      padding: .75rem;
      border: 1px solid #dce8e1;
      border-radius: 1rem;
      background: #f0f6f2;
    }

    .car-photo img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: .65rem;
    }

    .car-photo figcaption { color: #2c463a; }
    .car-photo figcaption p { margin: 0; }
    .car-photo a {
      display: inline-block;
      margin-top: .35rem;
      color: #405d52;
      font-size: .875rem;
      text-underline-offset: .16em;
    }

    @media (max-width: 30rem) {
      .car-photo { grid-template-columns: 1fr; }
      .car-photo img { width: min(100%, 15rem); justify-self: center; }
    }

    section { margin: 2rem 0; }
    h2 { margin: 0 0 .5rem; font-size: 1.25rem; }
    ul { margin: 0; padding-inline-start: 1.35rem; }
    li { padding: .45rem 0; }
    li + li { border-top: 1px solid #e4e9f3; }
    li::marker { color: #465ba1; }

    button {
      min-height: 2.75rem;
      padding: .6rem 1.2rem;
      border: 0;
      border-radius: .75rem;
      background: #354887;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #29396e; }
    button:focus-visible { outline: 3px solid #465ba1; outline-offset: 4px; }
  </style>
</head>

    <button id="change-background" type="button">배경색 바꾸기</button>
  </main>

  <script>
    const colors = ["#e8edf9", "#d5f1e4", "#ffe6cf", "#f2ddf6"];
    const skyColors = ["#456499", "#28796e", "#a65450", "#79578c"];
    let colorIndex = 0;

    document.getElementById("change-background").addEventListener("click", () => {
      colorIndex = (colorIndex + 1) % colors.length;
      document.body.style.backgroundColor = colors[colorIndex];
      scene.style.setProperty("--winter-sky", skyColors[colorIndex]);
    });

    const scene = document.querySelector(".winter-scene");
    const canvas = scene.querySelector("canvas");
    const context = canvas.getContext("2d");
    const motion = matchMedia("(prefers-reduced-motion: reduce)");
    const snowflakes = Array.from({ length: 95 }, () => ({
      x: Math.random(), y: Math.random(),
      radius: 1 + Math.random() * 2.4, speed: .06 + Math.random() * .16
    }));
    let animationFrame;

    function shape(color, points) {
      context.fillStyle = color;
      context.beginPath();
      points.forEach(([x, y]) => context.lineTo(x, y));
      context.closePath();
      context.fill();
    }

    function line(color, thickness, points) {
      context.strokeStyle = color;
      context.lineWidth = thickness;
      context.lineCap = "round";
      context.lineJoin = "round";
      context.beginPath();
      points.forEach(([x, y]) => context.lineTo(x, y));
      context.stroke();
    }

    function drawWinter(time) {
      const width = canvas.clientWidth;
      const height = canvas.clientHeight;
      const scale = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(width * scale) || canvas.height !== Math.round(height * scale)) {
        canvas.width = Math.round(width * scale);
        canvas.height = Math.round(height * scale);
      }
      context.setTransform(scale, 0, 0, scale, 0, 0);
      context.clearRect(0, 0, width, height);
      shape("#a7bbda", [[0, height], [0, 99], [width * .26, 37], [width * .51, 107], [width * .78, 48], [width, 103], [width, height]]);
      shape("#edf4ff", [[0, 119], [width * .45, 137], [width, 166], [width, height], [0, height]]);

      context.save();
      context.translate(width * .5, 92);
      line("#506898", 4, [[-40, 47], [38, 62], [47, 58]]);
      line("#34405d", 3, [[-32, 40], [-12, 5], [11, -7]]);
      line("#28364e", 9, [[0, 5], [22, 22], [10, 47]]);
      line("#3c4d6d", 9, [[-2, 6], [1, 27], [-14, 43]]);
      line("#26344d", 7, [[-16, 43], [-4, 46]]);
      line("#26344d", 7, [[8, 47], [22, 50]]);
      shape("#e76147", [[-12, 7], [-5, -22], [12, -29], [25, -11], [7, 16]]);
      line("#f07953", 8, [[10, -18], [1, -5], [-12, 5]]);
      shape("#ffcfac", [[12, -39], [31, -40], [32, -27], [20, -23], [12, -29]]);
      shape("#293958", [[8, -31], [8, -43], [17, -50], [28, -49], [35, -41], [35, -35]]);
      line("#a9e5f6", 5, [[19, -36], [34, -35]]);
      context.restore();

      context.fillStyle = "rgba(255, 255, 255, .88)";
      for (const flake of snowflakes) {
        const x = ((flake.x + time * .000025) % 1) * width;
        const y = ((flake.y + time * .001 * flake.speed) % 1) * height;
        context.beginPath();
        context.arc(x, y, flake.radius, 0, Math.PI * 2);
        context.fill();
      }
    }

    function animateWinter(time) {
      drawWinter(time);
      animationFrame = requestAnimationFrame(animateWinter);
    }

    function updateMotion() {
      cancelAnimationFrame(animationFrame);
      drawWinter(0);
      if (!motion.matches) animationFrame = requestAnimationFrame(animateWinter);
    }

    motion.addEventListener("change", updateMotion);
    window.addEventListener("resize", updateMotion);
    updateMotion();
  </script>
</body>
