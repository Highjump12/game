<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>자동차 부품 깨기</title>
  <link rel="stylesheet" href="brick_game.css">
  <script src="brick_game.js" defer></script>
</head>
<body>
  <main>
    <header>
      <h1>자동차 부품 깨기</h1>
      <div class="stats">
        <span>단계 <strong id="level">1 / 6</strong></span>
        <span>파괴 <strong id="progress">0 / 1</strong></span>
        <span>점수 <strong id="score">0</strong></span>
      </div>
    </header>
    <p class="guide">← → 바 이동 · 스페이스키 시작 · 단계 번호만큼 부품을 부수세요</p>
    <div class="stage">
      <canvas id="game" width="960" height="600" aria-label="자동차 부품 깨기 게임 영역"></canvas>
      <div id="message" class="message" role="status">스페이스키를 눌러 시작하세요</div>
    </div>
  </main>
</body>
</html>
